<text x="48" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1E293B">Neural Hawkes: event-triggered update and continuous-time evolution</text>
<text x="48" y="79" font-family="Arial,sans-serif" font-size="16" fill="#64748B">Schematic • each event changes memory; between events, memory relaxes toward a learned target</text>
<rect x="47" y="120" width="212" height="115" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="153" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#075985">Event arrives</text>
<text x="153" y="182" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#075985">type kᵢ at time tᵢ</text>
<text x="153" y="207" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#0369A1">discrete trigger</text>
<path d="M261 176 L307 176" stroke="#475569" stroke-width="3" fill="none"/><path d="M307 176 l-12 -7 v14 z" fill="#475569"/>
<rect x="310" y="120" width="232" height="115" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="426" y="151" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#6B21A8">CT-LSTM update</text>
<text x="426" y="180" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#6B21A8">cᵢ, c̄ᵢ, δᵢ</text>
<text x="426" y="208" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#7E22CE">learned from history</text>
<path d="M543 176 L589 176" stroke="#475569" stroke-width="3" fill="none"/><path d="M589 176 l-12 -7 v14 z" fill="#475569"/>
<rect x="592" y="120" width="269" height="115" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="726" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#166534">Between events</text>
<text x="726" y="179" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#166534">c(t) → h(t)</text>
<text x="726" y="209" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#15803D">continuous decay</text>
<path d="M862 176 L909 176" stroke="#475569" stroke-width="3" fill="none"/><path d="M909 176 l-12 -7 v14 z" fill="#475569"/>
<rect x="912" y="120" width="237" height="115" rx="14" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="1030" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#9A3412">Event intensity</text>
<text x="1030" y="180" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#9A3412">λₖ(t) = softplus(...)</text>
<text x="1030" y="207" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#C2410C">when / which type?</text>
