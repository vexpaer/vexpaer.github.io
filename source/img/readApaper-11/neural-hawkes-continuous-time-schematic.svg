<path d="M153 239 l-8 12 h16 z" fill="#94A3B8"/>
<text x="590" y="295" font-family="Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">Sample the next event, then repeat</text>
<text x="48" y="363" font-family="Arial,sans-serif" font-size="13" fill="#64748B">Conceptual diagram adapted from Mei &amp; Eisner (NeurIPS 2017), Sec. 3.2.2 — not empirical data.</text>
