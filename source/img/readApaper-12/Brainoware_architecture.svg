<rect x="280" y="440" width="680" height="125" rx="18" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/>
<text x="620" y="478" text-anchor="middle" font-size="20" font-weight="700" fill="#263750">Where does learning occur?</text>
<text x="620" y="514" text-anchor="middle" font-size="17" fill="#4D5D72">The organoid's functional dynamics can adapt with stimulation;</text>
<text x="620" y="540" text-anchor="middle" font-size="17" fill="#4D5D72">the external readout is separately trained using task labels.</text>
