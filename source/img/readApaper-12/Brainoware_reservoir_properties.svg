<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">Why a neural organoid can act as a reservoir</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">Two useful dynamical properties: nonlinear transformation and fading memory</text><g font-family="Arial"><rect x="65" y="155" width="500" height="410" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="315" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">1 · Nonlinear response</text><path d="M125 470 H510 M150 510 V245" stroke="#8290A5" stroke-width="2"/><path d="M150 470 C220 468 250 455 280 410 C315 355 325 280 490 260" fill="none" stroke="#4979C4" stroke-width="5" stroke-linecap="round"/><path d="M150 470 L490 260" stroke="#AAB5C5" stroke-width="2" stroke-dasharray="8 8"/><text x="330" y="535" text-anchor="middle" font-size="16" fill="#53647B">Input pulse strength</text><text x="100" y="360" transform="rotate(-90 100 360)" text-anchor="middle" font-size="16" fill="#53647B">Evoked activity</text><text x="320" y="235" text-anchor="middle" font-size="16" fill="#4979C4">Threshold + saturation</text><rect x="635" y="155" width="500" height="410" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="885" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">2 · Fading memory</text><path d="M690 470 H1080 M710 510 V245" stroke="#8290A5" stroke-width="2"/><path d="M710 470 L710 285 L735 285 L735 470" fill="#DCE9FB" stroke="#4979C4" stroke-width="2"/><path d="M735 285 C770 300 790 335 825 375 C865 420 910 448 1065 465" fill="none" stroke="#D08A42" stroke-width="5" stroke-linecap="round"/><path d="M735 285 L735 470" stroke="#4979C4" stroke-width="2" stroke-dasharray="6 6"/><text x="895" y="535" text-anchor="middle" font-size="16" fill="#53647B">