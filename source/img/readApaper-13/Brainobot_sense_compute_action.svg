<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">Brainobot: a closed-loop sense–compute–action system</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">The organoid selects high-level actions; conventional controllers execute the movement</text><g font-family="Arial"><rect x="60" y="210" width="200" height="170" rx="20" fill="#E8F0FE" stroke="#8BA9E8" stroke-width="2"/><text x="160" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#24477F">SENSE</text><text x="160" y="290" text-anchor="middle" font-size="17" fill="#365477">Camera + distance</text><text x="160" y="317" text-anchor="middle" font-size="17" fill="#365477">sensor</text><text x="160" y="345" text-anchor="middle" font-size="15" fill="#53647B">Scene / target location</text><rect x="315" y="210" width="210" height="170" rx="20" fill="#EAF7F1" stroke="#7DB99A" stroke-width="2"/><text x="420" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#286347">ENCODE</text><text x="420" y="290" text-anchor="middle" font-size="17" fill="#3E6F57">Image features →</text><text x="420" y="317" text-anchor="middle" font-size="17" fill="#3E6F57">electrical patterns</text><text x="420" y="345" text-anchor="middle" font-size="15" fill="#53647B">MEA stimulation</text><rect x="580" y="175" width="235" height="240" rx="22" fill="#FCEEDC" stroke="#D69B4A" stroke-width="2.5"/><text x="697" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#80501A">COMPUTE</text><ellipse cx="697" cy="295" rx="75" ry="48" fill="#E8B7A6" stroke="#B66F5D" stroke-width="2"/><g fill="#A64E5B"><circle cx="648" cy="291" r="6"/><circle cx="672" cy="270" r="5"/><circle cx="696" cy="300" r="6"/><circle cx="720" cy="276" r="5"/><circle cx="746" cy="299" r="6"/></g><g stroke="#A64E5B" stroke-width="2"><path d="M648 291 L672 270 L696 300 L720 276 L746 299"/></g><text x="697" y="370" text-anchor="middle" font-size="16" fill="#80501A">Organoid + readout</text><rect x="870" y="210" width="265" height="170" rx="20" fill="#F0EAFE" stroke="#A18BD9" stroke-width="2"/><text x="1002" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#5B468F">ACTION</text><text x="1002" y="290" text-anchor="middle" font-size="17" fill="#67558E">High-level command →</text><text x="1002" y="317" text-anchor="middle" font-size="17" fill="#67558E">robot controller</text><text x="1002" y="345" text-anchor="middle" font-size="15" fill="#53647B">Servo / locomotion</text><g stroke="#61738A" stroke-width="3" fill="none"><path d="M260 295 H310 M525 295 H575 M815 295 H865"/></g><g fill="#61738A"><path d="M302 286 L313 295 L302 304 Z"/><path d="M567 286 L578 295 L567 304 Z"/><path d="M857 286 L868 295 L857 304 Z"/></g><path d="M1000 400 V500 H160 V390" fill="none" stroke="#3D8C83" stroke-width="4" stroke-dasharray="10 8"/><path d="M151 401 L160 388 L169 401" fill="none" stroke="#3D8C83" stroke-width="4"/><rect x="390" y="465" width="420" height="75" rx="16" fill="#E6F4F1" stroke="#7DB99A" stroke-width="2"/><text x="600" y="495" text-anchor="middle" font-size="19" font-weight="700" fill="#286347">Environment changes</text><text x="600" y="520" text-anchor="middle" font-size="16" fill="#3E6F57">New scene becomes the next sensory input</text></g><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="16" fill="#69788D">Conceptual architecture redrawn from the Brainobot preprint.</text></svg>