<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">Three robot tasks, one biological decision layer</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">Brainobot maps encoded visual cues to a small set of motor primitives</text><g font-family="Arial"><rect x="55" y="150" width="345" height="330" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="227" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">1 · Hand raising</text><rect x="105" y="225" width="245" height="115" rx="14" fill="#E8F0FE"/><rect x="130" y="250" width="70" height="65" rx="8" fill="#FFFFFF" stroke="#8BA9E8"/><rect x="255" y="250" width="70" height="65" rx="8" fill="#25364C"/><text x="227" y="380" text-anchor="middle" font-size="17" fill="#53647B">Two visual patterns</text><text x="227" y="412" text-anchor="middle" font-size="16" fill="#53647B">→ left / right hand command</text><rect x="427" y="150" width="345" height="330" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="599" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">2 · Object grasping</text><rect x="477" y="225" width="245" height="115" rx="14" fill="#EAF7F1"/><rect x="515" y="250" width="60" height="65" rx="8" fill="#F2C76C"/><text x="545" y="294" text-anchor="middle" font-size="35" font-weight="700" fill="#6B4D19">I</text><rect x="625" y="250" width="60" height="65" rx="8" fill="#9BC9B3"/><text x="655" y="294" text-anchor="middle" font-size="35" font-weight="700" fill="#286347">U</text><text x="599" y="380" text-anchor="middle" font-size="17" fill="#53647B">I / U / blank</text><text x="599" y="412" text-anchor="middle" font-size="16" fill="#53647B">→ left / right / idle</text><rect x="800" y="150" width="345" height="330" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="972" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">3 · Laser chasing</text><rect x="850" y="225" width="245" height="115" rx="14" fill="#FCEEDC"/><path d="M880 310 H1065" stroke="#D69B4A" stroke-width="3"/><circle cx="900" cy="270" r="10" fill="#E35D6A"/><circle cx="972" cy="270" r="10" fill="#E35D6A"/><circle cx="1045" cy="270" r="10" fill="#E35D6A"/><text x="972" y="380" text-anchor="middle" font-size="17" fill="#53647B">Target left / centre / right</text><text x="972" y="412" text-anchor="middle" font-size="16" fill="#53647B">→ turn / forward / turn</text><rect x="160" y="515" width="880" height="80" rx="18" fill="#F0EAFE" stroke="#A18BD9" stroke-width="2"/><text x="600" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#5B468F">Cross-task adaptation</text><text x="600" y="575" text-anchor="middle" font-size="17" fill="#67558E">After laser-chasing practice, grasping began at a higher reported accuracy than an untrained condition.</text></g></svg>