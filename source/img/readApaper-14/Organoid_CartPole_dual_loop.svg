<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">CartPole organoid experiment: two nested loops</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">Fast feedback controls the pole; slower feedback changes the neural input–output mapping</text><g font-family="Arial"><rect x="65" y="170" width="1070" height="250" rx="22" fill="#FFFFFF" stroke="#8BA9E8" stroke-width="2.5"/><text x="95" y="210" font-size="21" font-weight="700" fill="#24477F">FAST LOOP · every control time step</text><rect x="105" y="250" width="200" height="110" rx="16" fill="#E8F0FE" stroke="#8BA9E8"/><text x="205" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#24477F">CartPole state</text><text x="205" y="325" text-anchor="middle" font-size="16" fill="#365477">angle θ, motion</text><rect x="365" y="250" width="200" height="110" rx="16" fill="#FCEEDC" stroke="#D69B4A"/><text x="465" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#80501A">Input units</text><text x="465" y="325" text-anchor="middle" font-size="16" fill="#80501A">rate-coded stimulation</text><rect x="625" y="250" width="200" height="110" rx="16" fill="#FCEEDC" stroke="#D69B4A"/><text x="725" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#80501A">Organoid</text><text x="725" y="325" text-anchor="middle" font-size="16" fill="#80501A">network activity</text><rect x="885" y="250" width="200" height="110" rx="16" fill="#EAF7F1" stroke="#7DB99A"/><text x="985" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#286347">Output units</text><text x="985" y="325" text-anchor="middle" font-size="16" fill="#3E6F57">decoded force ±10 N</text><g stroke="#61738A" stroke-width="3"><path d="M305 305 H360"/><path d="M565 305 H620"/><path d="M825 305 H880"/></g><g fill="#61738A"><path d="M352 296 L363 305 L352 314 Z"/><path d="M612 296 L623 305 L612 314 Z"/><path d="M872 296 L883 305 L872 314 Z"/></g><path d="M985 365 V395 H205 V365" fill="none" stroke="#3D8C83" stroke-width="3" stroke-dasharray="8 7"/><rect x="220" y="465" width="760" height="130" rx="20" fill="#F0EAFE" stroke="#A18BD9" stroke-width="2.5"/><text x="600" y="505" text-anchor="middle" font-size="21" font-weight="700" fill="#5B468F">SLOW TRAINING LOOP · after an episode</text><text x="600" y="540" text-anchor="middle" font-size="17" fill="#67558E">Task score → external RL with eligibility traces → choose a training-electrode pair</text><text x="600" y="570" text-anchor="middle" font-size="17" fill="#67558E">→ high-frequency training stimulation → next episode</text><path d="M725 420 V460" stroke="#A18BD9" stroke-width="3" stroke-dasharray="6 6"/><path d="M715 451 L725 463 L735 451" fill="none" stroke="#A18BD9" stroke-width="3"/></g><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="15" fill="#69788D">Conceptual schematic; not to scale. The RL optimizer is external to the organoid.</text></svg>