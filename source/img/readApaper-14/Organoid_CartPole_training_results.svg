<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">Adaptive stimulation improved CartPole training outcomes</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">Share of training cycles meeting the authors' proficiency criterion</text><g font-family="Arial"><path d="M130 500 H1080" stroke="#8290A5" stroke-width="2"/><path d="M130 500 V190" stroke="#8290A5" stroke-width="2"/><g fill="#53647B" font-size="15"><text x="112" y="505" text-anchor="end">0%</text><text x="112" y="430" text-anchor="end">15%</text><text x="112" y="355" text-anchor="end">30%</text><text x="112" y="280" text-anchor="end">45%</text><text x="112" y="205" text-anchor="end">60%</text></g><g stroke="#E0E5ED" stroke-width="1"><path d="M130 425 H1080"/><path d="M130 350 H1080"/><path d="M130 275 H1080"/><path d="M130 200 H1080"/></g><rect x="215" y="488.5" width="130" height="11.5" rx="8" fill="#9DAABD"/><rect x="435" y="477.5" width="130" height="22.5" rx="8" fill="#7D9CCB"/><rect x="655" y="384.5" width="130" height="115.5" rx="8" fill="#58A58C"/><rect x="875" y="268" width="130" height="232" rx="8" fill="#D69B4A"/><g fill="#263750" font-size="22" font-weight="700"><text x="280" y="470" text-anchor="middle">2.3%</text><text x="500" y="459" text-anchor="middle">4.5%</text><text x="720" y="366" text-anchor="middle">23.1%</text><text x="940" y="250" text-anchor="middle">46.4%</text></g><g fill="#53647B" font-size="16"><text x="280" y="535" text-anchor="middle">Null</text><text x="500" y="535" text-anchor="middle">Random</text><text x="720" y="535" text-anchor="middle">Adaptive</text><text x="940" y="535" text-anchor="middle">Continuous</text><text x="940" y="557" text-anchor="middle">adaptive</text></g><rect x="180" y="585" width="840" height="42" rx="12" fill="#FFFFFF" stroke="#D9E1EC"/><text x="600" y="612" text-anchor="middle" font-size="16" fill="#53647B">15-min training cycles were typically separated by 45-min rest periods.</text></g></svg>