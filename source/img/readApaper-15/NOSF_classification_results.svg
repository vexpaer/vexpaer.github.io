<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#F7F9FC"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#16233A">NOSF classification: distinguish the simulator from the hybrid system</text><text x="60" y="103" font-family="Arial" font-size="18" fill="#58677E">Reported accuracies in two separate MNIST settings</text><g font-family="Arial"><rect x="60" y="155" width="510" height="430" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="315" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">Binary MNIST · digits 0 vs 1</text><path d="M130 490 H510" stroke="#8290A5" stroke-width="2"/><rect x="190" y="237" width="115" height="253" rx="10" fill="#7D9CCB"/><rect x="365" y="244" width="115" height="246" rx="10" fill="#58A58C"/><text x="247" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#263750">96.80%</text><text x="422" y="229" text-anchor="middle" font-size="21" font-weight="700" fill="#263750">94.52%</text><text x="247" y="525" text-anchor="middle" font-size="17" fill="#53647B">2D model</text><text x="422" y="525" text-anchor="middle" font-size="17" fill="#53647B">3D model</text><text x="315" y="560" text-anchor="middle" font-size="15" fill="#69788D">Simulator's own activity-based classifier</text><rect x="630" y="155" width="510" height="430" rx="22" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="2"/><text x="885" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#29415F">Full MNIST · 10 classes</text><path d="M700 490 H1080" stroke="#8290A5" stroke-width="2"/><rect x="735" y="408" width="90" height="82" rx="9" fill="#9DAABD"/><rect x="860" y="251" width="90" height="239" rx="9" fill="#58A58C"/><rect x="985" y="235" width="90" height="255" rx="9" fill="#D69B4A"/><g fill="#263750" font-size="19" font-weight="700"><text x="780" y="392" text-anchor="middle">31.45%</text><text x="905" y="235" text-anchor="middle">91.64%</text><text x="1030" y="219" text-anchor="middle">97.60–</text><text x="1030" y="241" text-anchor="middle">97.96%</text></g><g fill="#53647B" font-size="15"><text x="780" y="525" text-anchor="middle">GIF only</text><text x="905" y="525" text-anchor="middle">+ 1-layer</text><text x="1030" y="525" text-anchor="middle">deeper</text><text x="885" y="560" text-anchor="middle">External supervised LIF-SNN improves the combined system</text></g></g><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="15" fill="#69788D">Values are reported by the submission; the two panels are different evaluation settings.</text></svg>