<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="412" viewBox="0 0 1142 412" role="img">
<title>Neuroengineering educational schematic</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="35" y="52" fill="#172033" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Statistically significant CAM changes across preparations</text><rect x="35" y="95" width="339" height="237" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="55" y="143" fill="#1d4ed8" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">2D rat cortical culture</text><text x="60" y="244" fill="#1d4ed8" font-size="45" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">87 / 227</text><text x="60" y="295" fill="#1d4ed8" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">38.3% significant</text><rect x="401" y="95" width="339" height="237" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text x="421" y="143" fill="#15803d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Slices + organoids</text><text x="426" y="244" fill="#15803d" font-size="45" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">20 / 52</text><text x="426" y="295" fill="#15803d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">38.5% significant</text><rect x="767" y="95" width="339" height="237" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="787" y="143" fill="#c2410c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">All tested pairs</text><text x="792" y="244" fill="#c2410c" font-size="45" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">107 / 279</text><text x="792" y="295" fill="#c2410c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">≈ 40% significant</text><text x="35" y="384" fill="#64748b" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Significant CAM change does NOT imply exact editing of a verified single-synapse weight.</text>
</svg>
