<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="456" viewBox="0 0 1130 456" role="img">
<title>Neuroengineering educational schematic</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="35" y="52" fill="#172033" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Spike-timing-dependent plasticity (STDP)</text><rect x="35" y="83" width="520" height="315" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><rect x="575" y="83" width="520" height="315" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="67" y="123" fill="#166534" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Pre before Post</text><text x="607" y="123" fill="#9a3412" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Post before Pre</text><text x="65" y="198" fill="#2563eb" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Pre (A)</text><text x="65" y="288" fill="#ea580c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Post (B)</text><line x1="187" y1="191" x2="507" y2="191" stroke="#94a3b8" stroke-width="2" /><line x1="187" y1="281" x2="507" y2="281" stroke="#94a3b8" stroke-width="2" /><text x="605" y="198" fill="#2563eb" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Pre (A)</text><text x="605" y="288" fill="#ea580c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Post (B)</text><line x1="727" y1="191" x2="1047" y2="191" stroke="#94a3b8" stroke-width="2" /><line x1="727" y1="281" x2="1047" y2="281" stroke="#94a3b8" stroke-width="2" /><path d="M258 191 H266 L270 153 L274 191 H282" stroke="#2563eb" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M408 281 H416 L420 243 L424 281 H432" stroke="#ea580c" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M948 191 H956 L960 153 L964 191 H972" stroke="#2563eb" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M798 281 H806 L810 243 L814 281 H822" stroke="#ea580c" stroke-width="3.4" fill="none" stroke-linejoin="round"/><line x1="270" y1="208" x2="270" y2="320" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/><line x1="420" y1="208" x2="420" y2="320" stroke="#fdba74" stroke-width="2" stroke-dasharray="5 5"/><line x1="810" y1="208" x2="810" y2="320" stroke="#fdba74" stroke-width="2" stroke-dasharray="5 5"/><line x1="960" y1="208" x2="960" y2="320" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/><text x="270" y="228" fill="#2563eb" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">0 ms</text><text x="420" y="315" fill="#ea580c" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">+5 ms</text><text x="810" y="315" fill="#ea580c" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">0 ms</text><text x="960" y="228" fill="#2563eb" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">+5 ms</text><text x="295" y="362" fill="#15803d" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">Δt = +5 ms  |  LTP favored</text><text x="835" y="362" fill="#c2410c" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">Δt = −5 ms  |  LTD favored</text><text x="35" y="424" fill="#64748b" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Δt = tPost − tPre. These are classical trends, not guaranteed biological outcomes.</text>
</svg>
