<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img">
<title>Neuroengineering educational schematic</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="35" y="52" fill="#172033" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Synaptic efficacy: same input, different response</text><rect x="35" y="88" width="510" height="264" rx="16" fill="#f8fafc" stroke="#dbe5ee" stroke-width="2"/><rect x="575" y="88" width="510" height="264" rx="16" fill="#effcf5" stroke="#a7f3d0" stroke-width="2"/><text x="68" y="135" fill="#475569" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Weaker excitatory connection</text><text x="608" y="135" fill="#166534" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Stronger excitatory connection</text><circle cx="115" cy="218" r="33" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="473" cy="218" r="33" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="115" y="226" fill="#1d4ed8" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">A</text><text x="473" y="226" fill="#166534" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">B</text><line x1="151" y1="218" x2="428" y2="218" stroke="#94a3b8" stroke-width="5" /><path d="M418 212 L428 218 L418 224" stroke="#94a3b8" stroke-width="5" fill="none"/><text x="290" y="193" fill="#64748b" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">smaller EPSP</text><text x="290" y="308" fill="#475569" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">Same presynaptic spike</text><circle cx="655" cy="218" r="33" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1013" cy="218" r="33" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="655" y="226" fill="#1d4ed8" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">A</text><text x="1013" y="226" fill="#166534" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">B</text><line x1="691" y1="218" x2="968" y2="218" stroke="#16a34a" stroke-width="13" /><path d="M958 212 L968 218 L958 224" stroke="#16a34a" stroke-width="13" fill="none"/><text x="830" y="193" fill="#15803d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">larger EPSP</text><text x="830" y="308" fill="#475569" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">Same presynaptic spike</text><text x="35" y="402" fill="#64748b" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Conceptual illustration. An EPSP may contribute to firing but is not itself an action potential.</text>
</svg>
