<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="420" viewBox="0 0 1146 420" role="img">
<title>Neuroengineering educational schematic</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="35" y="52" fill="#172033" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">HD-MEA workflow: record → select → stimulate → verify</text><rect x="32" y="98" width="255" height="238" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="53" y="147" fill="#0f172a" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">1  Record</text><text x="53" y="197" fill="#334155" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Spontaneous</text><text x="53" y="233" fill="#334155" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">spike trains</text><line x1="55" y1="275" x2="55" y2="313" stroke="#2563eb" stroke-width="4" /><line x1="103" y1="275" x2="103" y2="313" stroke="#2563eb" stroke-width="4" /><line x1="151" y1="275" x2="151" y2="313" stroke="#2563eb" stroke-width="4" /><line x1="199" y1="275" x2="199" y2="313" stroke="#2563eb" stroke-width="4" /><line x1="287" y1="216" x2="309" y2="216" stroke="#64748b" stroke-width="3" /><path d="M299 210 L309 216 L299 222" stroke="#64748b" stroke-width="3" fill="none"/><rect x="311" y="98" width="255" height="238" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="332" y="147" fill="#0f172a" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">2  Select</text><text x="332" y="197" fill="#334155" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Candidate</text><text x="332" y="233" fill="#334155" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">A → B sites</text><line x1="351" y1="292" x2="506" y2="292" stroke="#2563eb" stroke-width="5" /><path d="M496 286 L506 292 L496 298" stroke="#2563eb" stroke-width="5" fill="none"/><line x1="566" y1="216" x2="588" y2="216" stroke="#64748b" stroke-width="3" /><path d="M578 210 L588 216 L578 222" stroke="#64748b" stroke-width="3" fill="none"/><rect x="590" y="98" width="255" height="238" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="611" y="147" fill="#0f172a" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">3  Pair</text><text x="611" y="197" fill="#334155" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Pre pulse</text><text x="611" y="233" fill="#334155" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Post burst</text><path d="M638 306 H646 L650 268 L654 306 H662" stroke="#2563eb" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M698 306 H706 L710 268 L714 306 H722" stroke="#16a34a" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M724 306 H732 L736 268 L740 306 H748" stroke="#16a34a" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M750 306 H758 L762 268 L766 306 H774" stroke="#16a34a" stroke-width="3.4" fill="none" stroke-linejoin="round"/><path d="M776 306 H784 L788 268 L792 306 H800" stroke="#16a34a" stroke-width="3.4" fill="none" stroke-linejoin="round"/><line x1="845" y1="216" x2="867" y2="216" stroke="#64748b" stroke-width="3" /><path d="M857 210 L867 216 L857 222" stroke="#64748b" stroke-width="3" fill="none"/><rect x="869" y="98" width="255" height="238" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="890" y="147" fill="#0f172a" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">4  Re-record</text><text x="890" y="197" fill="#334155" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Compare CAM</text><text x="890" y="233" fill="#334155" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">with controls</text><text x="904" y="306" fill="#16a34a" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">ΔCAM</text><text x="35" y="385" fill="#64748b" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Timing is programmed at the electrodes; actual neuronal recruitment must be verified.</text>
</svg>
