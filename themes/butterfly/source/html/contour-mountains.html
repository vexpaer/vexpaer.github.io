<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动态等高线山脉</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #242424;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #242424;
      pointer-events: none;
    }

    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.16), transparent 30%),
        radial-gradient(ellipse 110% 92% at 50% 52%, transparent 45%, rgba(0, 0, 0, 0.3) 100%);
    }
  </style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var context = canvas.getContext('2d', { alpha: false });
  if (!context) return;

  var width = 1;
  var height = 1;
  var pixelRatio = 1;
  var running = false;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var random = randomFactory(271828);
  var clock = 0;
  var lastFrame = 0;
  var nextPulseAt = 1.8;
  var pulses = [];
  var background = null;
  var needsStaticFrame = true;

  function randomFactory (seed) {
    return function () {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      var value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    };
  }

  function clamp (value, low, high) {
    return value < low ? low : value > high ? high : value;
  }

  function gaussian (value, center, spread) {
    var distance = (value - center) / spread;
    return Math.exp(-0.5 * distance * distance);
  }

  function terrainProfile (x) {
    var mainPeak =
      gaussian(x, 0.61, 0.043) * 0.205 +
      gaussian(x, 0.585, 0.085) * 0.105;
    var leftMass =
      gaussian(x, 0.405, 0.066) * 0.145 +
      gaussian(x, 0.315, 0.037) * 0.055;
    var saddle = gaussian(x, 0.49, 0.06) * 0.075;
    var rightMass =
      gaussian(x, 0.715, 0.102) * 0.072 +
      gaussian(x, 0.82, 0.085) * 0.035;
    return mainPeak + leftMass + saddle + rightMass;
  }

  function staticRoughness (x, lineIndex, depth) {
    var broad = Math.sin(x * 49 + lineIndex * 0.61) * 0.7;
    var fine = Math.sin(x * 123 - lineIndex * 0.39) * 0.3;
    var ridgeMask = clamp(terrainProfile(x) * 7.5, 0.08, 1);
    return (broad + fine) * ridgeMask * (1 - depth * 0.42) * height * 0.0018;
  }

  function pulseOffset (x, depth) {
    var offset = 0;
    for (var index = 0; index < pulses.length; index++) {
      var pulse = pulses[index];
      var progress = (clock - pulse.start) / pulse.duration;
      if (progress <= 0 || progress >= 1) continue;

      var center = pulse.x + Math.sin(progress * Math.PI + pulse.phase) * 0.006;
      var horizontal = gaussian(x, center, pulse.radius);
      var vertical = gaussian(depth, pulse.depth, pulse.depthRadius);
      var envelope = Math.pow(Math.sin(progress * Math.PI), 2);
      var wave = Math.sin(
        (x - center) / pulse.radius * Math.PI * pulse.frequency +
        pulse.phase +
        progress * Math.PI * 3
      );
      offset += wave * horizontal * vertical * envelope * pulse.amplitude;
    }
    return offset;
  }

  function schedulePulse () {
    var size = Math.min(width, height);
    pulses.push({
      x: 0.12 + random() * 0.76,
      depth: 0.08 + random() * 0.76,
      radius: 0.035 + random() * 0.075,
      depthRadius: 0.08 + random() * 0.16,
      amplitude: clamp(size * (0.0025 + random() * 0.004), 1.5, 5.5),
      frequency: 1.6 + random() * 1.9,
      phase: random() * Math.PI * 2,
      start: clock,
      duration: 1.55 + random() * 1.6
    });
    nextPulseAt = clock + 2.4 + random() * 3.8;
  }

  function updatePulses () {
    if (clock >= nextPulseAt) schedulePulse();
    pulses = pulses.filter(function (pulse) {
      return clock - pulse.start < pulse.duration;
    });
  }

  function draw () {
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    context.fillStyle = background || '#242424';
    context.fillRect(0, 0, width, height);

    var lineCount = clamp(Math.round(height / 12.5), 42, 72);
    var pointCount = clamp(Math.round(width / 5), 130, 260);
    var horizon = height * 0.405;

    context.lineCap = 'round';
    context.lineJoin = 'round';

    for (var lineIndex = 0; lineIndex < lineCount; lineIndex++) {
      var depth = lineIndex / Math.max(1, lineCount - 1);
      var depthCurve = Math.pow(depth, 1.08);
      var base = horizon + depthCurve * height * 0.57;
      var relief = 0.94 * Math.pow(1 - depth, 0.72) + 0.035;

      context.beginPath();
      for (var pointIndex = 0; pointIndex <= pointCount; pointIndex++) {
        var xNormal = pointIndex / pointCount;
        var x = xNormal * width;
        var perspectiveTilt = (xNormal - 0.5) * height * -0.018 * (1 - depth);
        var y =
          base -
          terrainProfile(xNormal) * height * relief +
          perspectiveTilt +
          staticRoughness(xNormal, lineIndex, depth) +
          pulseOffset(xNormal, depth);

        if (pointIndex === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }

      var alpha = 0.42 + depth * 0.38;
      context.strokeStyle = 'rgba(244, 244, 244, ' + alpha.toFixed(3) + ')';
      context.lineWidth = depth < 0.18 ? 0.72 : 0.88;
      context.stroke();
    }

    needsStaticFrame = false;
  }

  function fit () {
    width = Math.max(1, Math.round(window.innerWidth));
    height = Math.max(1, Math.round(window.innerHeight));
    pixelRatio = Math.min(window.devicePixelRatio || 1, 1.65);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    background = context.createLinearGradient(0, 0, 0, height);
    background.addColorStop(0, '#303030');
    background.addColorStop(0.52, '#272727');
    background.addColorStop(1, '#151515');
    needsStaticFrame = true;
    draw();
  }

  function frame (time) {
    if (running && !document.hidden) {
      if (reducedMotion.matches) {
        if (needsStaticFrame) draw();
      } else if (time - lastFrame >= 1000 / 45) {
        var delta = lastFrame ? Math.min(0.08, (time - lastFrame) / 1000) : 0;
        clock += delta;
        lastFrame = time;
        updatePulses();
        draw();
      }
    }
    window.requestAnimationFrame(frame);
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== 'vexpaer-scene-visibility') return;
    running = Boolean(event.data.visible);
    if (running) {
      lastFrame = performance.now();
      needsStaticFrame = true;
      draw();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      lastFrame = performance.now();
      needsStaticFrame = true;
    }
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(fit, 120);
  });

  if (reducedMotion.addEventListener) {
    reducedMotion.addEventListener('change', function () {
      pulses = [];
      needsStaticFrame = true;
      draw();
    });
  }

  fit();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
