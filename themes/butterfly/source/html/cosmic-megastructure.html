<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙巨构</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #01020a;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #01020a;
      cursor: grab;
    }

    #scene:active { cursor: grabbing; }

    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(1, 2, 10, 0.42) 0%, rgba(1, 2, 10, 0.06) 24%, transparent 46%),
        radial-gradient(ellipse 90% 80% at 50% 50%, transparent 0 44%, rgba(1, 2, 10, 0.14) 72%, rgba(0, 1, 6, 0.42) 100%);
    }
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="shade" aria-hidden="true"></div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return;

  var W = 1;
  var H = 1;
  var DPR = 1;
  var running = true;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var lastTime = 0;
  var clock = 0;

  // 辉光层：所有自发光的东西额外画一份到降采样画布，模糊后叠加。
  // 比逐个元素画 radial-gradient 便宜得多，观感也更接近真实的镜头光晕。
  var bloomCanvas = document.createElement('canvas');
  var bctx = bloomCanvas.getContext('2d');
  var bloomScale = 0.3;
  var bloomSupported = false;

  var nebulaSprites = [];
  var grainCanvas = document.createElement('canvas');

  var centerX = 0;
  var centerY = 0;
  var focal = 1200;
  var tilt = 0.34;
  var tiltTarget = 0.34;
  var starRadius = 40;

  var starLayers = [];
  var nebulae = [];
  var rings = [];
  var swarm = [];
  var truss = null;
  var comets = [];
  var prominences = [];

  var pointerX = 0.5;
  var pointerY = 0.5;
  var dragging = false;
  var dragLastX = 0;
  var spinOffset = 0;
  var spinVelocity = 0;

  // ---------------------------------------------------------------- 工具

  function mulberry32 (seed) {
    return function () {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      var value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    };
  }

  function lerp (a, b, t) { return a + (b - a) * t; }
  function clamp (value, low, high) { return value < low ? low : value > high ? high : value; }
  function smoothstep (edge0, edge1, x) {
    var t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // 极简 3D：绕 X 轴倾斜后做一次透视投影。环世界只需要这些。
  function project (x, y, z, out) {
    var cos = Math.cos(tilt);
    var sin = Math.sin(tilt);
    var ty = y * cos - z * sin;
    var tz = y * sin + z * cos;
    var scale = focal / Math.max(120, focal + tz);
    out.x = centerX + x * scale;
    out.y = centerY + ty * scale;
    out.z = tz;
    out.s = scale;
    return out;
  }

  var pointA = { x: 0, y: 0, z: 0, s: 1 };
  var pointB = { x: 0, y: 0, z: 0, s: 1 };
  var pointC = { x: 0, y: 0, z: 0, s: 1 };
  var pointD = { x: 0, y: 0, z: 0, s: 1 };

  // ---------------------------------------------------------- 场景构建

  function buildGrain () {
    var size = 128;
    grainCanvas.width = size;
    grainCanvas.height = size;
    var gctx = grainCanvas.getContext('2d');
    var image = gctx.createImageData(size, size);
    var random = mulberry32(0xC0501C);
    for (var index = 0; index < image.data.length; index += 4) {
      var value = 128 + (random() - 0.5) * 86;
      image.data[index] = value;
      image.data[index + 1] = value;
      image.data[index + 2] = value;
      image.data[index + 3] = 255;
    }
    gctx.putImageData(image, 0, 0);
  }

  function buildNebulaSprites () {
    nebulaSprites = [];
    var palettes = [
      [[92, 62, 168], [46, 112, 196]],
      [[168, 66, 132], [86, 46, 156]],
      [[38, 118, 160], [26, 66, 130]]
    ];
    for (var variant = 0; variant < palettes.length; variant++) {
      var sprite = document.createElement('canvas');
      var size = 320;
      sprite.width = size;
      sprite.height = size;
      var nctx = sprite.getContext('2d');
      var random = mulberry32(0x0EB0 + variant * 613);
      var palette = palettes[variant];
      for (var puff = 0; puff < 34; puff++) {
        var px = size * (0.5 + (random() - 0.5) * 0.9);
        var py = size * (0.5 + (random() - 0.5) * 0.9);
        var pr = size * (0.08 + random() * 0.3);
        var mix = random();
        var color = [
          Math.round(lerp(palette[0][0], palette[1][0], mix)),
          Math.round(lerp(palette[0][1], palette[1][1], mix)),
          Math.round(lerp(palette[0][2], palette[1][2], mix))
        ];
        var alpha = 0.03 + random() * 0.07;
        var gradient = nctx.createRadialGradient(px, py, 0, px, py, pr);
        gradient.addColorStop(0, 'rgba(' + color[0] + ',' + color[1] + ',' + color[2] + ',' + alpha.toFixed(3) + ')');
        gradient.addColorStop(1, 'rgba(' + color[0] + ',' + color[1] + ',' + color[2] + ',0)');
        nctx.fillStyle = gradient;
        nctx.beginPath();
        nctx.arc(px, py, pr, 0, Math.PI * 2);
        nctx.fill();
      }
      nebulaSprites.push(sprite);
    }
  }

  function buildStars () {
    starLayers = [];
    var random = mulberry32(0x57A25);
    var layerSpecs = [
      { count: Math.round(W * H / 5200), size: [0.3, 0.9], alpha: [0.14, 0.5], parallax: 0.15 },
      { count: Math.round(W * H / 12000), size: [0.6, 1.5], alpha: [0.3, 0.8], parallax: 0.4 },
      { count: Math.round(W * H / 42000), size: [1.1, 2.6], alpha: [0.5, 1], parallax: 0.85 }
    ];

    for (var layer = 0; layer < layerSpecs.length; layer++) {
      var spec = layerSpecs[layer];
      var list = [];
      var count = clamp(spec.count, 20, 900);
      for (var index = 0; index < count; index++) {
        // 少量恒星带一点色温偏移，纯白星场会显得很塑料。
        var temperature = random();
        list.push({
          x: random(),
          y: random(),
          size: lerp(spec.size[0], spec.size[1], random()),
          alpha: lerp(spec.alpha[0], spec.alpha[1], random()),
          phase: random() * Math.PI * 2,
          speed: 0.3 + random() * 1.9,
          tint: temperature > 0.86 ? [176, 206, 255] : temperature < 0.12 ? [255, 200, 172] : [255, 250, 244]
        });
      }
      starLayers.push({ stars: list, parallax: spec.parallax });
    }
  }

  function buildNebulae () {
    nebulae = [];
    var random = mulberry32(0x0EB1A);
    var count = W < 720 ? 4 : 7;
    for (var index = 0; index < count; index++) {
      nebulae.push({
        sprite: Math.floor(random() * nebulaSprites.length),
        x: random() * W,
        y: random() * H,
        scale: (1.2 + random() * 2.6) * (Math.max(W, H) / 1100),
        rotation: random() * Math.PI * 2,
        spin: (random() - 0.5) * 0.014,
        drift: (random() - 0.5) * 2.4,
        alpha: 0.5 + random() * 0.5
      });
    }
  }

  function buildRings () {
    var unit = Math.min(W, H);
    starRadius = clamp(unit * 0.058, 22, 66);

    rings = [];

    // 主环世界：可见内壁上有海陆分带，是画面的主角。
    var main = {
      radius: unit * 0.72,
      width: unit * 0.062,
      segments: W < 720 ? 132 : 208,
      spin: 0.055,
      phase: 0,
      inclination: 0,
      kind: 'world',
      bands: []
    };
    var bandRandom = mulberry32(0x9012D);
    for (var band = 0; band < 42; band++) {
      main.bands.push({
        start: bandRandom(),
        length: 0.008 + bandRandom() * 0.05,
        // 0 = 海，1 = 陆
        land: bandRandom() > 0.42 ? 1 : 0,
        shade: 0.5 + bandRandom() * 0.5
      });
    }
    rings.push(main);

    // 更大更薄的轨道环，倾角不同，制造交叉。
    rings.push({
      radius: unit * 1.12,
      width: unit * 0.012,
      segments: W < 720 ? 96 : 152,
      spin: -0.032,
      phase: 1.1,
      inclination: 0.5,
      kind: 'orbital',
      bands: []
    });

    // 遮阳方阵：贴近恒星的一圈独立方板，会在环世界上投出昼夜。
    rings.push({
      radius: unit * 0.3,
      width: unit * 0.05,
      segments: 48,
      spin: 0.2,
      phase: 0.4,
      inclination: -0.18,
      kind: 'squares',
      bands: []
    });

    // 戴森集群：大量独立采光板，各自轨道半径与倾角。
    swarm = [];
    var swarmRandom = mulberry32(0x50A12);
    var swarmCount = W < 720 ? 130 : 320;
    for (var collector = 0; collector < swarmCount; collector++) {
      swarm.push({
        radius: unit * (0.16 + Math.pow(swarmRandom(), 0.7) * 0.95),
        angle: swarmRandom() * Math.PI * 2,
        speed: (0.06 + swarmRandom() * 0.3) * (swarmRandom() > 0.5 ? 1 : -1),
        inclination: (swarmRandom() - 0.5) * 1.5,
        size: unit * (0.0026 + swarmRandom() * 0.0075),
        flash: swarmRandom() * Math.PI * 2
      });
    }

    // 前景桁架：一段擦着镜头掠过的巨构桁架，负责给出尺度感。
    truss = {
      radius: unit * 1.9,
      centerY: H * 1.06,
      thickness: unit * 0.075,
      spin: 0.014,
      phase: 0,
      lights: []
    };
    var trussRandom = mulberry32(0x71255);
    for (var light = 0; light < 90; light++) {
      truss.lights.push({
        t: trussRandom(),
        phase: trussRandom() * Math.PI * 2,
        speed: 0.6 + trussRandom() * 2.4,
        cool: trussRandom() > 0.65
      });
    }

    // 恒星表面的日珥。
    prominences = [];
    var promRandom = mulberry32(0x9209);
    for (var prom = 0; prom < 7; prom++) {
      prominences.push({
        angle: promRandom() * Math.PI * 2,
        drift: (promRandom() - 0.5) * 0.1,
        height: 0.2 + promRandom() * 0.7,
        width: 0.16 + promRandom() * 0.3,
        phase: promRandom() * Math.PI * 2,
        speed: 0.3 + promRandom() * 0.7
      });
    }

    comets = [];
  }

  function build () {
    centerX = W * (W < 720 ? 0.5 : 0.42);
    centerY = H * 0.46;
    focal = Math.max(W, H) * 1.05;

    bloomCanvas.width = Math.max(1, Math.round(W * bloomScale));
    bloomCanvas.height = Math.max(1, Math.round(H * bloomScale));
    bloomSupported = typeof bctx.filter === 'string';

    buildStars();
    buildNebulae();
    buildRings();
  }

  function fit () {
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = Math.max(1, canvas.clientWidth || window.innerWidth);
    H = Math.max(1, canvas.clientHeight || window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  // ------------------------------------------------------------ 绘制：背景

  function drawBackground () {
    var gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.9);
    gradient.addColorStop(0, '#0a1030');
    gradient.addColorStop(0.34, '#050a1e');
    gradient.addColorStop(1, '#01020a');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }

  function drawNebulae (delta) {
    ctx.globalCompositeOperation = 'lighter';
    for (var index = 0; index < nebulae.length; index++) {
      var cloud = nebulae[index];
      cloud.rotation += cloud.spin * delta;
      cloud.x += cloud.drift * delta;
      if (cloud.x > W + 400) cloud.x = -400;
      if (cloud.x < -400) cloud.x = W + 400;

      var sprite = nebulaSprites[cloud.sprite];
      ctx.save();
      ctx.globalAlpha = cloud.alpha;
      ctx.translate(cloud.x + (pointerX - 0.5) * 14, cloud.y + (pointerY - 0.5) * 10);
      ctx.rotate(cloud.rotation);
      ctx.scale(cloud.scale, cloud.scale);
      ctx.drawImage(sprite, -sprite.width * 0.5, -sprite.height * 0.5);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStarfield () {
    for (var layer = 0; layer < starLayers.length; layer++) {
      var group = starLayers[layer];
      var shiftX = (pointerX - 0.5) * group.parallax * 26;
      var shiftY = (pointerY - 0.5) * group.parallax * 18;
      for (var index = 0; index < group.stars.length; index++) {
        var star = group.stars[index];
        var twinkle = 0.68 + 0.32 * Math.sin(clock * star.speed + star.phase);
        var alpha = star.alpha * twinkle;
        if (alpha <= 0.02) continue;
        ctx.fillStyle = 'rgba(' + star.tint[0] + ',' + star.tint[1] + ',' + star.tint[2] + ',' + alpha.toFixed(3) + ')';
        var x = star.x * W + shiftX;
        var y = star.y * H + shiftY;
        var size = star.size;
        if (size < 1) ctx.fillRect(x, y, size + 0.5, size + 0.5);
        else {
          ctx.beginPath();
          ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // ------------------------------------------------------------ 绘制：恒星

  function drawStar (target) {
    var pulse = 1 + Math.sin(clock * 0.7) * 0.03 + Math.sin(clock * 1.9) * 0.014;
    var radius = starRadius * pulse;

    var core = target.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 3.4);
    core.addColorStop(0, 'rgba(255, 253, 246, 1)');
    core.addColorStop(0.16, 'rgba(255, 240, 206, 0.96)');
    core.addColorStop(0.3, 'rgba(255, 206, 142, 0.6)');
    core.addColorStop(0.56, 'rgba(255, 156, 96, 0.2)');
    core.addColorStop(1, 'rgba(255, 128, 80, 0)');
    target.fillStyle = core;
    target.beginPath();
    target.arc(centerX, centerY, radius * 3.4, 0, Math.PI * 2);
    target.fill();

    // 日珥：贴着星面往外抛的弧形火舌。
    target.save();
    target.translate(centerX, centerY);
    for (var index = 0; index < prominences.length; index++) {
      var prom = prominences[index];
      var angle = prom.angle + clock * prom.drift;
      var breathe = 0.6 + 0.4 * Math.sin(clock * prom.speed + prom.phase);
      var height = radius * prom.height * breathe;
      if (height <= 1) continue;
      target.save();
      target.rotate(angle);
      var flame = target.createLinearGradient(0, -radius * 0.9, 0, -radius - height);
      flame.addColorStop(0, 'rgba(255, 198, 128, ' + (0.5 * breathe).toFixed(3) + ')');
      flame.addColorStop(0.5, 'rgba(255, 142, 88, ' + (0.22 * breathe).toFixed(3) + ')');
      flame.addColorStop(1, 'rgba(255, 110, 76, 0)');
      target.fillStyle = flame;
      target.beginPath();
      target.moveTo(-radius * prom.width, -radius * 0.9);
      target.quadraticCurveTo(0, -radius - height * 1.25, radius * prom.width, -radius * 0.9);
      target.closePath();
      target.fill();
      target.restore();
    }
    target.restore();
  }

  // ------------------------------------------------------ 绘制：环形巨构

  // 一段一段地画带宽的环。z 值决定它在恒星前还是后，
  // 因此调用方按 side 分两次绘制，恒星夹在中间。
  function drawRing (target, ring, side) {
    var segments = ring.segments;
    var inner = ring.radius - ring.width * 0.5;
    var outer = ring.radius + ring.width * 0.5;
    var incl = ring.inclination;
    var cosI = Math.cos(incl);
    var sinI = Math.sin(incl);

    for (var index = 0; index < segments; index++) {
      var a0 = (index / segments) * Math.PI * 2 + ring.phase + spinOffset * (ring.kind === 'world' ? 1 : 0.4);
      var a1 = ((index + 1) / segments) * Math.PI * 2 + ring.phase + spinOffset * (ring.kind === 'world' ? 1 : 0.4);

      // 环面先绕 Z 轴倾一个倾角，再交给统一的投影。
      var s0 = Math.sin(a0);
      var c0 = Math.cos(a0);
      var s1 = Math.sin(a1);
      var c1 = Math.cos(a1);

      project(c0 * inner, s0 * inner * sinI, s0 * inner * cosI, pointA);
      project(c1 * inner, s1 * inner * sinI, s1 * inner * cosI, pointB);
      project(c1 * outer, s1 * outer * sinI, s1 * outer * cosI, pointC);
      project(c0 * outer, s0 * outer * sinI, s0 * outer * cosI, pointD);

      var depth = (pointA.z + pointB.z) * 0.5;
      var isFar = depth > 0;
      if (side === 'far' && !isFar) continue;
      if (side === 'near' && isFar) continue;

      // 遮阳方阵是离散的板，隔一段留一段空。
      if (ring.kind === 'squares' && index % 3 !== 0) continue;

      var facing = clamp((depth / ring.radius + 1) * 0.5, 0, 1);
      var fill;

      if (ring.kind === 'world') {
        // 远半环看到的是被恒星照亮的内壁；近半环是背光的外壳。
        var litness = smoothstep(-0.15, 0.55, depth / ring.radius);
        if (litness > 0.05) {
          var t = index / segments;
          var band = null;
          for (var b = 0; b < ring.bands.length; b++) {
            var candidate = ring.bands[b];
            var localT = ((t + ring.phase / (Math.PI * 2) + spinOffset / (Math.PI * 2)) % 1 + 1) % 1;
            if (localT >= candidate.start && localT < candidate.start + candidate.length) {
              band = candidate;
              break;
            }
          }
          var seaColor = [22, 74, 128];
          var landColor = [96, 116, 78];
          var base = band && band.land ? landColor : seaColor;
          var shade = band ? band.shade : 0.7;

          // 遮阳方阵扫过的位置压暗，形成缓慢移动的"夜"。
          var night = 0.55 + 0.45 * Math.sin(a0 * 6 - clock * 0.55);
          var brightness = litness * shade * lerp(0.45, 1, night);
          fill = 'rgb(' +
            Math.round(base[0] * brightness + 176 * brightness * 0.5) + ',' +
            Math.round(base[1] * brightness + 168 * brightness * 0.5) + ',' +
            Math.round(base[2] * brightness + 150 * brightness * 0.5) + ')';
        } else {
          var dark = lerp(10, 34, facing);
          fill = 'rgb(' + Math.round(dark) + ',' + Math.round(dark * 1.08) + ',' + Math.round(dark * 1.32) + ')';
        }
      } else if (ring.kind === 'orbital') {
        var glow = smoothstep(-0.4, 0.7, depth / ring.radius);
        var value = lerp(26, 148, glow);
        fill = 'rgba(' + Math.round(value * 0.66) + ',' + Math.round(value * 0.86) + ',' + Math.round(value) + ',0.85)';
      } else {
        var facingSun = smoothstep(-0.2, 0.6, -depth / ring.radius);
        var panel = lerp(18, 120, facingSun);
        fill = 'rgba(' + Math.round(panel) + ',' + Math.round(panel * 0.92) + ',' + Math.round(panel * 0.7) + ',0.9)';
      }

      target.fillStyle = fill;
      target.beginPath();
      target.moveTo(pointA.x, pointA.y);
      target.lineTo(pointB.x, pointB.y);
      target.lineTo(pointC.x, pointC.y);
      target.lineTo(pointD.x, pointD.y);
      target.closePath();
      target.fill();

      // 环世界边缘的挡墙轮廓线，是整个结构最"人造"的细节。
      if (ring.kind === 'world') {
        target.strokeStyle = isFar
          ? 'rgba(198, 226, 255, 0.16)'
          : 'rgba(150, 186, 230, 0.08)';
        target.lineWidth = 0.7;
        target.beginPath();
        target.moveTo(pointA.x, pointA.y);
        target.lineTo(pointB.x, pointB.y);
        target.stroke();
        target.beginPath();
        target.moveTo(pointD.x, pointD.y);
        target.lineTo(pointC.x, pointC.y);
        target.stroke();
      }
    }
  }

  function drawSwarm (target, side, delta) {
    for (var index = 0; index < swarm.length; index++) {
      var panel = swarm[index];
      if (delta) panel.angle += panel.speed * delta;

      var cosI = Math.cos(panel.inclination);
      var sinI = Math.sin(panel.inclination);
      var s = Math.sin(panel.angle);
      var c = Math.cos(panel.angle);
      project(c * panel.radius, s * panel.radius * sinI, s * panel.radius * cosI, pointA);

      var isFar = pointA.z > 0;
      if (side === 'far' && !isFar) continue;
      if (side === 'near' && isFar) continue;

      // 板面周期性地正对恒星，反光一闪。
      var flash = Math.pow(Math.max(0, Math.sin(panel.angle * 2 + panel.flash)), 12);
      var size = Math.max(0.6, panel.size * pointA.s);
      var alpha = (isFar ? 0.34 : 0.6) + flash * 0.4;

      target.fillStyle = flash > 0.3
        ? 'rgba(255, 238, 198, ' + alpha.toFixed(3) + ')'
        : 'rgba(146, 172, 208, ' + (alpha * 0.6).toFixed(3) + ')';
      target.fillRect(pointA.x - size * 0.5, pointA.y - size * 0.5, size, size * 0.62);
    }
  }

  function drawTruss (target) {
    if (!truss) return;
    var cx = centerX * 0.4 + W * 0.3;
    var cy = truss.centerY;
    var radius = truss.radius;
    var inner = radius - truss.thickness;

    // 主桁架：一条掠过画面下缘的暗色巨弧。
    target.fillStyle = '#04060f';
    target.beginPath();
    target.arc(cx, cy, radius, Math.PI * 1.12, Math.PI * 1.88, false);
    target.arc(cx, cy, inner, Math.PI * 1.88, Math.PI * 1.12, true);
    target.closePath();
    target.fill();

    target.strokeStyle = 'rgba(122, 156, 200, 0.3)';
    target.lineWidth = 1;
    target.beginPath();
    target.arc(cx, cy, radius, Math.PI * 1.12, Math.PI * 1.88, false);
    target.stroke();
    target.strokeStyle = 'rgba(96, 126, 168, 0.18)';
    target.beginPath();
    target.arc(cx, cy, inner, Math.PI * 1.12, Math.PI * 1.88, false);
    target.stroke();

    // 桁架肋条
    target.strokeStyle = 'rgba(88, 116, 156, 0.22)';
    for (var rib = 0; rib <= 46; rib++) {
      var angle = Math.PI * 1.12 + (rib / 46) * Math.PI * 0.76;
      target.beginPath();
      target.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      target.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
      target.stroke();
    }

    // 沿桁架流动的工作灯。
    target.globalCompositeOperation = 'lighter';
    for (var light = 0; light < truss.lights.length; light++) {
      var lamp = truss.lights[light];
      var t = (lamp.t + clock * 0.014 * (lamp.cool ? 1 : -1)) % 1;
      if (t < 0) t += 1;
      var lampAngle = Math.PI * 1.12 + t * Math.PI * 0.76;
      var lampRadius = inner + truss.thickness * (0.2 + 0.6 * Math.abs(Math.sin(lamp.phase)));
      var pulse = 0.45 + 0.55 * Math.pow(Math.max(0, Math.sin(clock * lamp.speed + lamp.phase)), 3);
      target.fillStyle = lamp.cool
        ? 'rgba(168, 214, 255, ' + (pulse * 0.8).toFixed(3) + ')'
        : 'rgba(255, 196, 132, ' + (pulse * 0.8).toFixed(3) + ')';
      target.beginPath();
      target.arc(cx + Math.cos(lampAngle) * lampRadius, cy + Math.sin(lampAngle) * lampRadius, 1.5, 0, Math.PI * 2);
      target.fill();
    }
    target.globalCompositeOperation = 'source-over';
  }

  function drawComets (target, delta) {
    for (var index = comets.length - 1; index >= 0; index--) {
      var comet = comets[index];
      comet.life += delta;
      if (comet.life >= comet.duration) {
        comets.splice(index, 1);
        continue;
      }
      var t = comet.life / comet.duration;
      comet.x += comet.vx * delta;
      comet.y += comet.vy * delta;
      var fade = Math.sin(t * Math.PI);
      var tailX = comet.x - comet.vx * 0.22;
      var tailY = comet.y - comet.vy * 0.22;

      var tail = target.createLinearGradient(comet.x, comet.y, tailX, tailY);
      tail.addColorStop(0, 'rgba(226, 240, 255, ' + (0.85 * fade).toFixed(3) + ')');
      tail.addColorStop(1, 'rgba(150, 190, 255, 0)');
      target.strokeStyle = tail;
      target.lineWidth = 1.8;
      target.lineCap = 'round';
      target.beginPath();
      target.moveTo(comet.x, comet.y);
      target.lineTo(tailX, tailY);
      target.stroke();
    }
  }

  // -------------------------------------------------------------- 辉光

  function drawBloomSources (target) {
    target.save();
    target.scale(bloomScale, bloomScale);
    drawStar(target);
    drawSwarm(target, 'far', 0);
    drawSwarm(target, 'near', 0);
    drawComets(target, 0);
    target.restore();
  }

  function applyBloom () {
    if (!bloomSupported) return;
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);
    drawBloomSources(bctx);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.72;
    ctx.filter = 'blur(' + (Math.max(W, H) * 0.006).toFixed(2) + 'px)';
    ctx.drawImage(bloomCanvas, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.restore();
  }

  function drawGrain () {
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.038;
    var size = grainCanvas.width;
    var shiftX = -Math.floor(Math.random() * size);
    var shiftY = -Math.floor(Math.random() * size);
    for (var x = shiftX; x < W; x += size) {
      for (var y = shiftY; y < H; y += size) {
        ctx.drawImage(grainCanvas, x, y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawVignette () {
    var vignette = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.3, W * 0.5, H * 0.5, Math.max(W, H) * 0.76);
    vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignette.addColorStop(1, 'rgba(0, 1, 6, 0.56)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  // ------------------------------------------------------------------ 主循环

  function render (delta) {
    // 拖拽的角动量慢慢衰减，松手后环还会继续转一小会儿。
    spinOffset += spinVelocity * delta;
    spinVelocity *= Math.pow(0.02, delta);

    tilt += (tiltTarget - tilt) * Math.min(1, delta * 3);

    for (var index = 0; index < rings.length; index++) {
      rings[index].phase += rings[index].spin * delta;
    }

    drawBackground();
    drawNebulae(delta);
    drawStarfield();

    // 远侧结构 → 恒星 → 近侧结构，遮挡关系自然成立。
    for (var far = 0; far < rings.length; far++) drawRing(ctx, rings[far], 'far');
    drawSwarm(ctx, 'far', delta);

    drawStar(ctx);

    for (var near = 0; near < rings.length; near++) drawRing(ctx, rings[near], 'near');
    drawSwarm(ctx, 'near', 0);

    drawComets(ctx, delta);
    drawTruss(ctx);
    applyBloom();
    drawVignette();
    drawGrain();
  }

  function frame (now) {
    var delta = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;

    if (running && !reduced.matches) {
      clock += delta;
      render(delta);
    }
    window.requestAnimationFrame(frame);
  }

  // -------------------------------------------------------------- 交互

  canvas.addEventListener('pointermove', function (event) {
    var bounds = canvas.getBoundingClientRect();
    pointerX = (event.clientX - bounds.left) / Math.max(1, bounds.width);
    pointerY = (event.clientY - bounds.top) / Math.max(1, bounds.height);
    // 纵向拖拽改变观察倾角，横向拖拽给环加转速。
    tiltTarget = clamp(0.14 + pointerY * 0.55, 0.08, 0.78);
    if (dragging) {
      var deltaX = event.clientX - dragLastX;
      dragLastX = event.clientX;
      spinVelocity = clamp(spinVelocity + deltaX * 0.0022, -1.6, 1.6);
    }
  }, { passive: true });

  canvas.addEventListener('pointerdown', function (event) {
    dragging = true;
    dragLastX = event.clientX;
    if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
  });

  function endDrag () { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('click', function (event) {
    var bounds = canvas.getBoundingClientRect();
    var x = event.clientX - bounds.left;
    var y = event.clientY - bounds.top;
    if (comets.length > 5) comets.shift();
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.max(W, H) * (0.28 + Math.random() * 0.3);
    comets.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      duration: 1.5 + Math.random() * 0.9
    });
  });

  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== 'vexpaer-scene-visibility') return;
    running = Boolean(event.data.visible);
    if (running) lastTime = performance.now();
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(fit, 180);
  });

  buildGrain();
  buildNebulaSprites();
  fit();
  render(0);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
