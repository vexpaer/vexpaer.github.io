<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海边巨构</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1020;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #0a1020;
      cursor: pointer;
    }

    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(6, 10, 22, 0.44) 0%, rgba(6, 10, 22, 0.08) 22%, transparent 42%),
        radial-gradient(ellipse 88% 78% at 50% 52%, transparent 0 46%, rgba(5, 9, 18, 0.12) 74%, rgba(4, 7, 15, 0.36) 100%);
    }
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="shade" aria-hidden="true"></div>
<script>
(function () {
  'use strict';

  // 画卷式实现：三层背景（天空/巨构/海面）只在加载与尺寸变化时绘制一次，
  // 因此可以承受上万笔触的细节量；每帧只做三次 drawImage 合成（带视差），
  // 再叠一层轻量粒子（信标、窗光、海面碎金、天灯、雾霭）。
  // 若站点提供 /img/scene-seaside.jpg，将自动用照片替换手绘背景，粒子照常叠加。

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return;

  var W = 1;
  var H = 1;
  var DPR = 1;
  var horizon = 1;
  var running = true;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var lastTime = 0;
  var clock = 0;

  var skyLayer = document.createElement('canvas');
  var structLayer = document.createElement('canvas');
  var seaLayer = document.createElement('canvas');

  var photo = null;
  var photoReady = false;

  var beacons = [];
  var twinkleWindows = [];
  var glints = [];
  var lanterns = [];
  var mists = [];
  var aircraft = null;
  var sun = { x: 0, y: 0, r: 0 };

  var pointerX = 0.5;
  var pointerY = 0.5;
  var parallaxX = 0;
  var parallaxY = 0;

  var glowWarmSprite = null;
  var glowCoolSprite = null;
  var mistSprite = null;

  // ---------------------------------------------------------------- 工具

  function mulberry32 (seed) {
    return function () {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      var value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    };
  }

  function lerp (a, b, t) { return a + (b - a) * t; }
  function clamp (value, low, high) { return value < low ? low : value > high ? high : value; }

  function makeGlowSprite (r, g, b) {
    var sprite = document.createElement('canvas');
    sprite.width = 64;
    sprite.height = 64;
    var sctx = sprite.getContext('2d');
    var gradient = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    gradient.addColorStop(0.25, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
    gradient.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    sctx.fillStyle = gradient;
    sctx.fillRect(0, 0, 64, 64);
    return sprite;
  }

  function makeMistSprite () {
    var sprite = document.createElement('canvas');
    sprite.width = 256;
    sprite.height = 96;
    var sctx = sprite.getContext('2d');
    var gradient = sctx.createRadialGradient(128, 48, 0, 128, 48, 120);
    gradient.addColorStop(0, 'rgba(196, 176, 186, 0.55)');
    gradient.addColorStop(0.6, 'rgba(170, 158, 176, 0.22)');
    gradient.addColorStop(1, 'rgba(150, 142, 166, 0)');
    sctx.fillStyle = gradient;
    sctx.save();
    sctx.translate(128, 48);
    sctx.scale(1, 0.38);
    sctx.beginPath();
    sctx.arc(0, 0, 120, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();
    return sprite;
  }

  // ------------------------------------------------------ 画卷：天空层

  function paintSky (target) {
    var sctx = target.getContext('2d');
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var gradient = sctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#0b1026');
    gradient.addColorStop(0.2, '#1c2a4a');
    gradient.addColorStop(0.38, '#3a4d6a');
    gradient.addColorStop(0.5, '#7a5f68');
    gradient.addColorStop(0.57, '#c37a55');
    gradient.addColorStop(0.615, '#ffca85');
    gradient.addColorStop(0.63, '#e8a06a');
    gradient.addColorStop(1, '#4a3a48');
    sctx.fillStyle = gradient;
    sctx.fillRect(0, 0, W, H);

    var random = mulberry32(0x5EA51);

    // 手绘感的水平色带：一层层极淡的暖冷笔触扫过去，天空便不再是数学渐变。
    for (var band = 0; band < 160; band++) {
      var bandY = random() * horizon;
      var t = bandY / horizon;
      var warm = t > 0.55;
      var alpha = 0.015 + random() * 0.03;
      sctx.fillStyle = warm
        ? 'rgba(255, ' + Math.round(150 + random() * 70) + ', ' + Math.round(90 + random() * 50) + ', ' + alpha.toFixed(3) + ')'
        : 'rgba(' + Math.round(90 + random() * 60) + ', ' + Math.round(110 + random() * 60) + ', ' + Math.round(170 + random() * 60) + ', ' + alpha.toFixed(3) + ')';
      var bandHeight = 2 + random() * 8;
      var bandX = random() * W * 0.6 - W * 0.1;
      var bandWidth = W * (0.4 + random() * 0.8);
      sctx.fillRect(bandX, bandY, bandWidth, bandHeight);
    }

    // 星星：上半天静态铺好，动态闪烁的一小撮交给粒子层。
    for (var star = 0; star < 420; star++) {
      var sy = Math.pow(random(), 1.7) * horizon * 0.55;
      var sx = random() * W;
      var size = random() > 0.92 ? 1.6 : 0.9;
      var starAlpha = (0.2 + random() * 0.6) * (1 - sy / (horizon * 0.62));
      sctx.fillStyle = 'rgba(230, 238, 255, ' + starAlpha.toFixed(3) + ')';
      sctx.fillRect(sx, sy, size, size);
    }

    // 太阳：多层辉光 + 微微压扁的日轮，悬在海平线上。
    var glowLayers = [
      [sun.r * 7.2, 'rgba(255, 160, 96, 0.14)'],
      [sun.r * 4.2, 'rgba(255, 178, 106, 0.22)'],
      [sun.r * 2.4, 'rgba(255, 198, 128, 0.34)'],
      [sun.r * 1.35, 'rgba(255, 222, 168, 0.6)']
    ];
    for (var glow = 0; glow < glowLayers.length; glow++) {
      var radius = glowLayers[glow][0];
      var halo = sctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, radius);
      halo.addColorStop(0, glowLayers[glow][1]);
      halo.addColorStop(1, 'rgba(255, 150, 90, 0)');
      sctx.fillStyle = halo;
      sctx.beginPath();
      sctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.save();
    sctx.translate(sun.x, sun.y);
    sctx.scale(1, 0.94);
    var disc = sctx.createRadialGradient(0, 0, 0, 0, 0, sun.r);
    disc.addColorStop(0, '#fff7e2');
    disc.addColorStop(0.7, '#ffe0a8');
    disc.addColorStop(1, '#ffbe78');
    sctx.fillStyle = disc;
    sctx.beginPath();
    sctx.arc(0, 0, sun.r, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();

    // 层积云带：暗紫的云顶压着亮金的云底，两笔叠出体积。
    for (var cloud = 0; cloud < 20; cloud++) {
      var cy = horizon * (0.18 + Math.pow(random(), 1.35) * 0.74);
      var ct = cy / horizon;
      var cw = W * (0.1 + random() * 0.3) * (0.5 + ct);
      var ch = 3 + ct * 13 * (0.5 + random());
      var cx = random() * (W + cw) - cw * 0.5;
      var nearSun = Math.max(0, 1 - Math.abs(cx - sun.x) / (W * 0.5));

      sctx.save();
      sctx.translate(cx, cy);
      var topGradient = sctx.createLinearGradient(0, -ch, 0, ch * 0.4);
      topGradient.addColorStop(0, 'rgba(56, 48, 84, ' + (0.26 + random() * 0.2).toFixed(3) + ')');
      topGradient.addColorStop(1, 'rgba(80, 62, 96, 0)');
      sctx.fillStyle = topGradient;
      sctx.beginPath();
      sctx.ellipse(0, 0, cw * 0.5, ch, 0, 0, Math.PI * 2);
      sctx.fill();
      var underGradient = sctx.createLinearGradient(0, ch * 0.1, 0, ch);
      underGradient.addColorStop(0, 'rgba(255, 176, 110, 0)');
      underGradient.addColorStop(1, 'rgba(255, ' + Math.round(168 + nearSun * 50) + ', ' + Math.round(96 + nearSun * 44) + ', ' + (0.16 + nearSun * 0.3).toFixed(3) + ')');
      sctx.fillStyle = underGradient;
      sctx.beginPath();
      sctx.ellipse(0, ch * 0.42, cw * 0.44, ch * 0.6, 0, 0, Math.PI * 2);
      sctx.fill();
      sctx.restore();
    }

    // 远岸城市：贴着地平线的微小剪影群，藏在雾里。
    for (var town = 0; town < 70; town++) {
      var tx = random() * W;
      var th = 2 + Math.pow(random(), 2.2) * horizon * 0.045;
      var tw = 2 + random() * 9;
      sctx.fillStyle = 'rgba(52, 58, 88, ' + (0.14 + random() * 0.2).toFixed(3) + ')';
      sctx.fillRect(tx, horizon - th, tw, th + 1);
    }

    // 地平线雾：把所有远景揉进一条暖雾带。
    var hazeGradient = sctx.createLinearGradient(0, horizon - H * 0.09, 0, horizon);
    hazeGradient.addColorStop(0, 'rgba(224, 156, 110, 0)');
    hazeGradient.addColorStop(1, 'rgba(238, 172, 120, 0.3)');
    sctx.fillStyle = hazeGradient;
    sctx.fillRect(0, horizon - H * 0.09, W, H * 0.09);
  }

  // ------------------------------------------------------ 画卷：巨构层

  function paintWindows (sctx, random, x, y, w, h, density, coolRatio, saveEvery) {
    var cellW = clamp(w / Math.max(4, Math.round(w / 7)), 3, 9);
    var cellH = clamp(h / Math.max(4, Math.round(h / 10)), 3.5, 12);
    var columns = Math.floor(w / cellW);
    var rows = Math.floor(h / cellH);
    var painted = 0;
    for (var row = 0; row < rows; row++) {
      for (var column = 0; column < columns; column++) {
        if (random() > density) continue;
        var wx = x + column * cellW + cellW * 0.22;
        var wy = y + row * cellH + cellH * 0.24;
        var ww = Math.max(1, cellW * 0.42);
        var wh = Math.max(1, cellH * 0.4);
        var cool = random() < coolRatio;
        var alpha = 0.25 + Math.pow(random(), 1.4) * 0.7;
        sctx.fillStyle = cool
          ? 'rgba(150, 206, 255, ' + (alpha * 0.72).toFixed(3) + ')'
          : 'rgba(255, 202, 130, ' + alpha.toFixed(3) + ')';
        sctx.fillRect(wx, wy, ww, wh);
        painted++;
        if (saveEvery && painted % saveEvery === 0 && twinkleWindows.length < 90) {
          twinkleWindows.push({ x: wx, y: wy, w: ww, h: wh, cool: cool, phase: random() * Math.PI * 2, speed: 0.5 + random() * 1.6 });
        }
      }
    }
  }

  function paintBlock (sctx, x, y, w, h, baseShade) {
    // 主体块面 + 朝阳侧的暖边光 + 顶面高光，三笔一个体块。
    var fill = sctx.createLinearGradient(x, 0, x + w, 0);
    fill.addColorStop(0, 'rgba(30, 40, 62, ' + baseShade.toFixed(3) + ')');
    fill.addColorStop(1, 'rgba(16, 24, 40, ' + baseShade.toFixed(3) + ')');
    sctx.fillStyle = fill;
    sctx.fillRect(x, y, w, h);
    var rim = sctx.createLinearGradient(x, 0, x + Math.min(w * 0.32, 16), 0);
    rim.addColorStop(0, 'rgba(255, 178, 116, 0.3)');
    rim.addColorStop(1, 'rgba(255, 178, 116, 0)');
    sctx.fillStyle = rim;
    sctx.fillRect(x, y, Math.min(w * 0.32, 16), h);
    sctx.fillStyle = 'rgba(210, 226, 246, 0.12)';
    sctx.fillRect(x, y, w, 1.5);
  }

  function paintStructure (target) {
    var sctx = target.getContext('2d');
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, W, H);

    var random = mulberry32(0x9E01);
    beacons = [];
    twinkleWindows = [];

    var unit = Math.min(W, H);

    // —— 海上巨门：横跨左侧海面的巨型门架，桥面高悬，斜拉索垂落 ——
    var gateDeckY = horizon - unit * 0.34;
    var gateLeft = -W * 0.06;
    var gateRight = W * 0.52;
    var legWidth = unit * 0.055;

    // 两条门腿从海里长出来
    var legPositions = [W * 0.1, W * 0.42];
    for (var leg = 0; leg < legPositions.length; leg++) {
      var legX = legPositions[leg];
      paintBlock(sctx, legX - legWidth * 0.5, gateDeckY - unit * 0.1, legWidth, horizon - gateDeckY + unit * 0.11, 0.92);
      // 腿顶的塔冠
      paintBlock(sctx, legX - legWidth * 0.34, gateDeckY - unit * 0.19, legWidth * 0.68, unit * 0.1, 0.85);
      paintWindows(sctx, random, legX - legWidth * 0.45, gateDeckY, legWidth * 0.9, horizon - gateDeckY - unit * 0.02, 0.34, 0.28, 7);
      beacons.push({ x: legX, y: gateDeckY - unit * 0.19, r: 2.2, warm: true, period: 2.6, offset: leg * 1.3 });
    }

    // 桥面主梁：两层，下层透出密集窗光
    paintBlock(sctx, gateLeft, gateDeckY, gateRight - gateLeft, unit * 0.028, 0.95);
    paintBlock(sctx, gateLeft, gateDeckY + unit * 0.028, gateRight - gateLeft, unit * 0.02, 0.8);
    paintWindows(sctx, random, gateLeft + 8, gateDeckY + unit * 0.006, gateRight - gateLeft - 16, unit * 0.04, 0.5, 0.35, 9)

    // 斜拉索
    sctx.strokeStyle = 'rgba(150, 180, 220, 0.2)';
    sctx.lineWidth = 0.8;
    for (var cable = 0; cable < 26; cable++) {
      var cableT = cable / 25;
      var anchorX = lerp(gateLeft + 20, gateRight - 20, cableT);
      var pylonX = cableT < 0.5 ? legPositions[0] : legPositions[1];
      sctx.beginPath();
      sctx.moveTo(pylonX, gateDeckY - unit * 0.18);
      sctx.lineTo(anchorX, gateDeckY + 2);
      sctx.stroke();
    }

    // —— 右侧主塔群：从海中拔起的阶梯式弧光塔 ——
    var towerCenter = W * 0.76;
    var towerBase = W < 720 ? unit * 0.34 : unit * 0.3;
    var towerHeight = horizon * 0.82;
    var tiers = 7;
    var tierBottom = horizon + unit * 0.02;
    for (var tier = 0; tier < tiers; tier++) {
      var tierT = tier / (tiers - 1);
      var tierW = towerBase * lerp(1, 0.3, Math.pow(tierT, 0.85));
      var tierH = towerHeight * lerp(0.2, 0.09, tierT);
      var offset = (random() - 0.5) * towerBase * 0.05;
      var tierX = towerCenter - tierW * 0.5 + offset;
      var tierY = tierBottom - tierH;
      paintBlock(sctx, tierX, tierY, tierW, tierH, lerp(0.98, 0.86, tierT));
      paintWindows(sctx, random, tierX + 3, tierY + 3, tierW - 6, tierH - 6, lerp(0.44, 0.3, tierT), 0.3, 6);
      // 侧翼扶壁
      if (tier < 4) {
        var finW = tierW * 0.12;
        paintBlock(sctx, tierX - finW * 0.7, tierY + tierH * 0.25, finW, tierH * 0.8, 0.8);
        paintBlock(sctx, tierX + tierW - finW * 0.3, tierY + tierH * 0.3, finW, tierH * 0.75, 0.8);
      }
      tierBottom = tierY + tierH * 0.05;
    }
    // 塔顶双桅与信标
    var apexY = tierBottom;
    sctx.fillStyle = 'rgba(20, 30, 48, 0.95)';
    sctx.fillRect(towerCenter - 1.4, apexY - unit * 0.13, 2.8, unit * 0.13);
    sctx.fillRect(towerCenter - towerBase * 0.11 - 1, apexY - unit * 0.07, 2, unit * 0.07);
    beacons.push({ x: towerCenter, y: apexY - unit * 0.13, r: 2.6, warm: true, period: 2.2, offset: 0 });
    beacons.push({ x: towerCenter - towerBase * 0.11, y: apexY - unit * 0.07, r: 2, warm: true, period: 2.2, offset: 1.1 });
    beacons.push({ x: towerCenter - towerBase * 0.44, y: horizon - towerHeight * 0.2, r: 1.8, warm: false, period: 3.4, offset: 0.6 });
    beacons.push({ x: towerCenter + towerBase * 0.46, y: horizon - towerHeight * 0.24, r: 1.8, warm: false, period: 3.4, offset: 2.1 });

    // —— 中景卫星塔两座，衔接巨门与主塔 ——
    var satellites = [[W * 0.58, 0.34, 0.08], [W * 0.63, 0.22, 0.06]];
    for (var sat = 0; sat < satellites.length; sat++) {
      var satX = satellites[sat][0];
      var satH = horizon * satellites[sat][1];
      var satW = unit * satellites[sat][2];
      paintBlock(sctx, satX - satW * 0.5, horizon - satH, satW, satH + 4, 0.78);
      paintWindows(sctx, random, satX - satW * 0.45, horizon - satH + 3, satW * 0.9, satH - 6, 0.3, 0.3, 8);
      beacons.push({ x: satX, y: horizon - satH - 2, r: 1.6, warm: true, period: 2.9, offset: sat * 1.7 });
    }

    // 底部水汽：让所有结构的根部融进海雾。
    var footHaze = sctx.createLinearGradient(0, horizon - H * 0.05, 0, horizon + 2);
    footHaze.addColorStop(0, 'rgba(226, 164, 118, 0)');
    footHaze.addColorStop(1, 'rgba(234, 170, 122, 0.26)');
    sctx.fillStyle = footHaze;
    sctx.fillRect(0, horizon - H * 0.05, W, H * 0.05 + 2);
  }

  // ------------------------------------------------------ 画卷：海面层

  function paintSea (target) {
    var sctx = target.getContext('2d');
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, W, H);

    var random = mulberry32(0x0CEA);
    var seaTop = horizon;
    var seaDepth = H - seaTop;

    var gradient = sctx.createLinearGradient(0, seaTop, 0, H);
    gradient.addColorStop(0, '#d0906a');
    gradient.addColorStop(0.06, '#5a5a68');
    gradient.addColorStop(0.22, '#28404e');
    gradient.addColorStop(0.6, '#122430');
    gradient.addColorStop(1, '#081420');
    sctx.fillStyle = gradient;
    sctx.fillRect(0, seaTop, W, seaDepth + 1);

    // 太阳的碎金路径：越近越宽、越碎。
    for (var glint = 0; glint < 760; glint++) {
      var gt = Math.pow(random(), 1.35);
      var gy = seaTop + gt * seaDepth;
      var spreadHalf = lerp(sun.r * 0.7, W * 0.24, gt);
      var gx = sun.x + (random() - 0.5) * 2 * spreadHalf;
      var glintW = (1 + random() * 3) * (0.5 + gt * 2);
      var glintAlpha = (0.1 + random() * 0.38) * (1 - gt * 0.4);
      sctx.fillStyle = 'rgba(255, ' + Math.round(190 + random() * 40) + ', ' + Math.round(120 + random() * 50) + ', ' + glintAlpha.toFixed(3) + ')';
      sctx.fillRect(gx, gy, glintW, Math.max(0.8, glintW * 0.24));
    }

    // 巨构倒影：结构层完成后调用，把窗光区抽成垂直拖尾的碎笔触。
    var reflectionSources = [
      { x: W * 0.1, half: Math.min(W, H) * 0.05, warm: 0.7 },
      { x: W * 0.42, half: Math.min(W, H) * 0.05, warm: 0.7 },
      { x: W * 0.76, half: Math.min(W, H) * 0.18, warm: 0.6 },
      { x: W * 0.58, half: Math.min(W, H) * 0.05, warm: 0.55 },
      { x: W * 0.63, half: Math.min(W, H) * 0.04, warm: 0.55 }
    ];
    for (var source = 0; source < reflectionSources.length; source++) {
      var ref = reflectionSources[source];
      for (var streak = 0; streak < 240; streak++) {
        var st = Math.pow(random(), 1.5);
        var sy = seaTop + st * seaDepth * 0.72;
        var sx = ref.x + (random() - 0.5) * 2 * ref.half * (1 + st * 0.7);
        var streakH = (1.5 + random() * 6) * (0.4 + st);
        var alpha = (0.05 + random() * 0.2) * (1 - st * 0.75);
        var warm = random() < ref.warm;
        sctx.fillStyle = warm
          ? 'rgba(255, 188, 122, ' + alpha.toFixed(3) + ')'
          : 'rgba(140, 196, 244, ' + (alpha * 0.8).toFixed(3) + ')';
        sctx.fillRect(sx, sy, 1 + random() * 1.6, streakH);
      }
    }

    // 波纹线：横向的暗色细线，透视间距。
    for (var wave = 0; wave < 64; wave++) {
      var wt = wave / 63;
      var wy = seaTop + Math.pow(wt, 1.9) * seaDepth;
      sctx.strokeStyle = 'rgba(8, 16, 26, ' + (0.06 + wt * 0.2).toFixed(3) + ')';
      sctx.lineWidth = 0.5 + wt * 1.8;
      sctx.beginPath();
      var waveLength = lerp(60, 380, wt);
      var amplitude = lerp(0.5, 5, wt);
      var phase = random() * Math.PI * 2;
      for (var wx = -20; wx <= W + 20; wx += Math.max(8, waveLength / 10)) {
        var wyy = wy + Math.sin(wx / waveLength * Math.PI * 2 + phase) * amplitude;
        if (wx <= -20) sctx.moveTo(wx, wyy);
        else sctx.lineTo(wx, wyy);
      }
      sctx.stroke();
    }

    // 近岸浮沫
    for (var foam = 0; foam < 130; foam++) {
      var ft = 0.7 + random() * 0.3;
      var fy = seaTop + ft * seaDepth;
      sctx.fillStyle = 'rgba(190, 210, 224, ' + (0.03 + random() * 0.08).toFixed(3) + ')';
      sctx.fillRect(random() * W, fy, 2 + random() * 14, 1);
    }
  }

  // ---------------------------------------------------------- 粒子层

  function buildParticles () {
    var random = mulberry32(0x9A27);

    glints = [];
    var glintCount = W < 720 ? 90 : 170;
    for (var index = 0; index < glintCount; index++) {
      var gt = Math.pow(random(), 1.4);
      glints.push({
        x: sun.x + (random() - 0.5) * 2 * lerp(sun.r, W * 0.22, gt),
        y: horizon + gt * (H - horizon) * 0.92,
        size: (0.8 + random() * 2) * (0.6 + gt * 1.6),
        phase: random() * Math.PI * 2,
        speed: 1.8 + random() * 4.5
      });
    }

    mists = [];
    for (var mist = 0; mist < 4; mist++) {
      mists.push({
        x: random() * W,
        y: horizon - 4 - random() * H * 0.03,
        scale: (0.9 + random() * 1.6) * (W / 1280),
        speed: (3 + random() * 5) * (random() > 0.5 ? 1 : -1),
        alpha: 0.1 + random() * 0.1
      });
    }

    lanterns = [];
    aircraft = { x: -0.1, y: 0.1 + random() * 0.12, speed: 0.011 + random() * 0.008 };
  }

  function spawnLantern (x, y) {
    if (lanterns.length > 13) lanterns.shift();
    lanterns.push({
      x: x,
      y: y,
      age: 0,
      life: 17 + Math.random() * 9,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.5 + Math.random() * 0.5,
      rise: 9 + Math.random() * 7,
      size: 5 + Math.random() * 5
    });
  }

  var nextLantern = 2;

  function drawParticles (delta) {
    // 信标脉冲
    for (var beacon = 0; beacon < beacons.length; beacon++) {
      var light = beacons[beacon];
      var cycle = (clock + light.offset) % light.period / light.period;
      var pulse = Math.pow(Math.max(0, Math.sin(cycle * Math.PI)), 5);
      if (pulse <= 0.02) continue;
      var sprite = light.warm ? glowWarmSprite : glowCoolSprite;
      var size = light.r * 14 * (0.7 + pulse * 0.5);
      ctx.globalAlpha = pulse * 0.85;
      ctx.drawImage(sprite, light.x + parallaxX * 0.6 - size * 0.5, light.y + parallaxY * 0.6 - size * 0.5, size, size);
    }
    ctx.globalAlpha = 1;

    // 窗光闪烁
    for (var window_ = 0; window_ < twinkleWindows.length; window_++) {
      var cell = twinkleWindows[window_];
      var flicker = 0.5 + 0.5 * Math.sin(clock * cell.speed + cell.phase);
      if (flicker < 0.24) continue;
      ctx.fillStyle = cell.cool
        ? 'rgba(170, 216, 255, ' + (flicker * 0.6).toFixed(3) + ')'
        : 'rgba(255, 214, 150, ' + (flicker * 0.75).toFixed(3) + ')';
      ctx.fillRect(cell.x + parallaxX * 0.6, cell.y + parallaxY * 0.6, cell.w, cell.h);
    }

    // 海面碎金闪烁
    ctx.globalCompositeOperation = 'lighter';
    for (var glint = 0; glint < glints.length; glint++) {
      var spark = glints[glint];
      var twinkle = Math.pow(Math.max(0, Math.sin(clock * spark.speed + spark.phase)), 3);
      if (twinkle <= 0.03) continue;
      ctx.fillStyle = 'rgba(255, 224, 170, ' + (twinkle * 0.7).toFixed(3) + ')';
      ctx.fillRect(spark.x + parallaxX * 0.85 - spark.size, spark.y + parallaxY * 0.85, spark.size * 2, Math.max(0.8, spark.size * 0.4));
    }
    ctx.globalCompositeOperation = 'source-over';

    // 天灯：从海岸缓缓升起的暖光点。
    nextLantern -= delta;
    if (nextLantern <= 0) {
      spawnLantern(W * (0.05 + Math.random() * 0.9), horizon + (H - horizon) * (0.1 + Math.random() * 0.3));
      nextLantern = 3.2 + Math.random() * 4;
    }
    for (var lantern = lanterns.length - 1; lantern >= 0; lantern--) {
      var lamp = lanterns[lantern];
      lamp.age += delta;
      if (lamp.age >= lamp.life) {
        lanterns.splice(lantern, 1);
        continue;
      }
      var t = lamp.age / lamp.life;
      var ly = lamp.y - lamp.age * lamp.rise;
      var lx = lamp.x + Math.sin(lamp.age * lamp.swaySpeed + lamp.swayPhase) * 14;
      var fade = Math.min(1, lamp.age * 1.4) * (1 - Math.pow(t, 3));
      var size = lamp.size * (2.6 - t * 0.9);
      ctx.globalAlpha = fade * 0.8;
      ctx.drawImage(glowWarmSprite, lx - size, ly - size, size * 2, size * 2);
      ctx.globalAlpha = fade * 0.9;
      ctx.fillStyle = 'rgba(255, 214, 150, 0.9)';
      ctx.fillRect(lx - 1.1, ly - 1.6, 2.2, 3.2);
      // 水上的一点倒影
      if (ly < horizon && ly > horizon - 130) {
        var mirrorY = horizon + (horizon - ly) * 0.55;
        if (mirrorY < H) {
          ctx.globalAlpha = fade * 0.2 * (1 - (horizon - ly) / 130);
          ctx.drawImage(glowWarmSprite, lx - size * 0.8, mirrorY - size * 0.5, size * 1.6, size);
        }
      }
    }
    ctx.globalAlpha = 1;

    // 海雾漂移
    for (var mist = 0; mist < mists.length; mist++) {
      var fog = mists[mist];
      fog.x += fog.speed * delta;
      var mistW = mistSprite.width * fog.scale;
      if (fog.speed > 0 && fog.x - mistW * 0.5 > W) fog.x = -mistW * 0.5;
      if (fog.speed < 0 && fog.x + mistW * 0.5 < 0) fog.x = W + mistW * 0.5;
      ctx.globalAlpha = fog.alpha;
      ctx.drawImage(mistSprite, fog.x - mistW * 0.5 + parallaxX * 0.7, fog.y - mistSprite.height * fog.scale * 0.5, mistW, mistSprite.height * fog.scale);
    }
    ctx.globalAlpha = 1;

    // 高空航班
    if (aircraft) {
      aircraft.x += aircraft.speed * delta * 0.1;
      if (aircraft.x > 1.15) {
        aircraft.x = -0.15;
        aircraft.y = 0.08 + Math.random() * 0.14;
      }
      var ax = aircraft.x * W;
      var ay = aircraft.y * horizon;
      var strobe = Math.pow(Math.max(0, Math.sin(clock * 3.4)), 10);
      ctx.fillStyle = 'rgba(255, 235, 220, ' + (0.25 + strobe * 0.7).toFixed(3) + ')';
      ctx.fillRect(ax, ay, 2, 2);
    }
  }

  // ------------------------------------------------------------------ 合成

  function build () {
    horizon = H * (H < 520 ? 0.58 : 0.62);
    sun.x = W * 0.27;
    sun.y = horizon - Math.min(W, H) * 0.012;
    sun.r = clamp(Math.min(W, H) * 0.052, 24, 76);

    var layers = [skyLayer, structLayer, seaLayer];
    for (var layer = 0; layer < layers.length; layer++) {
      layers[layer].width = Math.max(1, Math.round(W * DPR));
      layers[layer].height = Math.max(1, Math.round(H * DPR));
    }

    if (!photoReady) {
      paintSky(skyLayer);
      paintStructure(structLayer);
      paintSea(seaLayer);
    }
    buildParticles();
  }

  function fit () {
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = Math.max(1, canvas.clientWidth || window.innerWidth);
    H = Math.max(1, canvas.clientHeight || window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function drawBackdrop () {
    if (photoReady && photo) {
      // 照片模式：cover 裁切 + 轻微视差缩放。
      var scale = Math.max(W / photo.naturalWidth, H / photo.naturalHeight) * 1.045;
      var drawW = photo.naturalWidth * scale;
      var drawH = photo.naturalHeight * scale;
      ctx.drawImage(
        photo,
        (W - drawW) * 0.5 + parallaxX,
        (H - drawH) * 0.5 + parallaxY,
        drawW,
        drawH
      );
      return;
    }
    ctx.drawImage(skyLayer, parallaxX * 0.3, parallaxY * 0.3, W, H);
    ctx.drawImage(structLayer, parallaxX * 0.6, parallaxY * 0.6, W, H);
    ctx.drawImage(seaLayer, parallaxX * 0.85, parallaxY * 0.85, W, H);
  }

  function render (delta) {
    var targetX = (pointerX - 0.5) * (W < 720 ? -6 : -14);
    var targetY = (pointerY - 0.5) * -6;
    parallaxX += (targetX - parallaxX) * 0.05;
    parallaxY += (targetY - parallaxY) * 0.05;

    ctx.fillStyle = '#0a1020';
    ctx.fillRect(0, 0, W, H);
    drawBackdrop();
    drawParticles(delta);
  }

  function frame (now) {
    var delta = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (running && !reduced.matches) {
      clock += delta;
      render(delta);
    }
    window.requestAnimationFrame(frame);
  }

  // -------------------------------------------------------------- 交互

  canvas.addEventListener('pointermove', function (event) {
    var bounds = canvas.getBoundingClientRect();
    pointerX = (event.clientX - bounds.left) / Math.max(1, bounds.width);
    pointerY = (event.clientY - bounds.top) / Math.max(1, bounds.height);
  }, { passive: true });

  canvas.addEventListener('pointerdown', function (event) {
    var bounds = canvas.getBoundingClientRect();
    spawnLantern(event.clientX - bounds.left, event.clientY - bounds.top);
  });

  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== 'vexpaer-scene-visibility') return;
    running = Boolean(event.data.visible);
    if (running) lastTime = performance.now();
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(fit, 180);
  });

  if (reduced.addEventListener) {
    reduced.addEventListener('change', function () {
      if (reduced.matches) render(0);
    });
  }

  // 可选照片背景：存在 /img/scene-seaside.jpg 时自动替换手绘画卷。
  photo = new Image();
  photo.addEventListener('load', function () {
    photoReady = true;
    render(0);
  });
  photo.src = '../img/scene-seaside.jpg';

  glowWarmSprite = makeGlowSprite(255, 186, 110);
  glowCoolSprite = makeGlowSprite(150, 206, 255);
  mistSprite = makeMistSprite();
  fit();
  render(0);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
